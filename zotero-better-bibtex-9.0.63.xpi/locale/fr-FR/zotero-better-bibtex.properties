better-bibtex_preferences_advanced_export_reset-cache.label=Le cache sera recr\u00e9\u00e9 au prochain d\u00e9marrage
better-bibtex_preferences_advanced_export_retain-cache_warning=Par d\u00e9faut, BBT efface tous les caches chaque fois que lui ou Zotero est mis \u00e0 jour. Je ne peux pas pr\u00e9dire de mani\u00e8re certaine si un changement dans Zotero ou BBT va affecter la sortie g\u00e9n\u00e9r\u00e9e pour un \u00e9l\u00e9ment donn\u00e9 donc, pour \u00eatre s\u00fbr(e) que vous avez toujours les derni\u00e8res corrections affectant les exportations, les caches sont supprim\u00e9s lorsqu'une nouvelle version de l'un ou l'autre est d\u00e9tect\u00e9e. Cependant, si vous avez une tr\u00e8s grande biblioth\u00e8que dont vous exportez r\u00e9guli\u00e8rement des portions significatives, vous pourriez vouloir conserver les \u00e9l\u00e9ments mis en cache m\u00eame si cela comporte le risque que vous obteniez une sortie incorrecte sur l'exportation qui a \u00e9t\u00e9 corrig\u00e9e dans l'intervalle.\n\nSi cette option est activ\u00e9e et que vous rencontrez un probl\u00e8me autre que l'annulation du cache lors d'une mise \u00e0 jour, vous *devez* vider le cache et reproduire le probl\u00e8me. Lorsque vous modifiez ce param\u00e8tre, le cache est supprim\u00e9 (comme c'est le cas pour toute modification de param\u00e8tre).
better-bibtex_preferences_advanced_export_title-case.label=Appliquer la capitalisation aux titres
better-bibtex_preferences_advanced_export_title-case_warning=Si vous n'\u00eates pas pr\u00eat \u00e0 ignorer \u00e0 la fois les meilleures pratiques BibTeX/BibLaTeX (voir la FAQ BBT) et les recommandations de Zotero sur la casse des titres/phrases, vous pouvez d\u00e9sactiver cette option pour supprimer la casse de titre pour les entr\u00e9es en anglais
