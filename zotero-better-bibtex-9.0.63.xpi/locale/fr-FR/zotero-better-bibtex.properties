better-bibtex_error-report_review=Les donn\u00e9es ci-dessous sont sur le point d'\u00eatre soumises \u00e0 Better BibTeX pour le d\u00e9bogage. Vous pouvez pr\u00e9visualiser les donn\u00e9es ici, ou enregistrer une copie du journal pour obtenir les donn\u00e9es pr\u00e9cises sur le point d'\u00eatre envoy\u00e9es, pour voir s'il y a des informations sensibles que vous souhaitez ne pas envoyer. R\u00e9fl\u00e9chissez bien \u00e0 la n\u00e9cessit\u00e9 de d\u00e9cocher les options ci-dessous dans votre environnement. Nous aurons g\u00e9n\u00e9ralement besoin de plus de communication (\= de temps) si vous supprimez des parties du journal de cette mani\u00e8re.\n\nSi vous \u00eates d'accord avec l'envoi de ces donn\u00e9es, passez \u00e0 l'\u00e9cran suivant, o\u00f9 vous obtiendrez un identifiant de d\u00e9bogage rouge, et publiez cet identifiant sur le syst\u00e8me de suivi des probl\u00e8mes \u00e0 l'adresse suivante \:\n\nhttps\://github.com/retorquere/zotero-better-bibtex/issue
