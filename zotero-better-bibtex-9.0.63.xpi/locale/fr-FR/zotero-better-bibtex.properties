better-bibtex_preferences_advanced_import_case-protection_on.label=oui
better-bibtex_preferences_advanced_import_case-protection_warning=\u00c0 l'importation, BBT prot\u00e8gera la casse (<span class\="nocase">...<span>) des mots entre {Braces} dans les titres.\n\nBeaucoup de fichiers bib(la)tex le font de fa\u00e7on un peu trop z\u00e9l\u00e9e et vous n'aimez peut-\u00eatre pas le code HTML qui en r\u00e9sulte dans vos entr\u00e9es, m\u00eame si c'est ce que les accolades signifient en bib(la)tex, et Zotero fournit cette fonctionnalit\u00e9.\n\nSi vous d\u00e9sactivez cette option, le balisage est omis lors de l'importation. Lorsque vous s\u00e9lectionnez \u00ab oui \u00bb, toutes les accolades que bib(la)tex interpr\u00e9terait comme une protection de casse (ce qui n'est pas le cas de toutes) sont converties en \u00e9l\u00e9ments `span`.\nEn mode \u00ab minimal \u00bb, le nombre d'\u00e9l\u00e9ments `span` est minimis\u00e9.
better-bibtex_preferences_advanced_import_sentence-case=Titres avec casse de phrase lors de l'importation \:
better-bibtex_preferences_advanced_import_sentence-case_off.label=non (importer les titres tels quels)
better-bibtex_preferences_advanced_import_sentence-case_on.label=oui
better-bibtex_preferences_advanced_import_sentence-case_on-guess.label=oui, mais en essayant d'exclure les titres d\u00e9j\u00e0 avec casse de phrase
better-bibtex_preferences_advanced_import_sentence-case_warning=Les entr\u00e9es Bib(La)TeX devraient \u00eatre stock\u00e9es capitalis\u00e9es (NdT \: c.-\u00e0-d. avec l'initiale de chaque mot en capitale ; cette r\u00e8gle est conforme \u00e0 la typographie anglaise mais pas fran\u00e7aise) ; les entr\u00e9es Zotero devraient \u00eatre saisies avec casse de phrase (NdT \: c.-\u00e0-d. avec seule l'initiale de la phrase en capitale).\n\nAvec cette option activ\u00e9e, BBT essaiera d'appliquer la casse de phrase lors de l'importation. Le m\u00e9canisme sous-jacent utilise des heuristiques \: aucun traitement de langage naturel n'est effectu\u00e9, et les r\u00e9sultats ne sont pas parfaits.\n\nVous pouvez d\u00e9sactiver cette option, mais vous pouvez aussi vouloir d\u00e9sactiver \u00ab Appliquer la capitalisation aux titres \u00bb (qui a ses propres probl\u00e8mes, voir l'aide pour cette option sur cette page).\nAvec \u00ab oui, mais en essayant d'exclure les titres d\u00e9j\u00e0 avec casse de phrase \u00bb, BBT tentera de d\u00e9tecter les titres d\u00e9j\u00e0 avec casse de phrase et ne les modifiera pas \u00e0 l'importation.
