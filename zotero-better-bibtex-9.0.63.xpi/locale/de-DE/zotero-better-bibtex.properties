better-bibtex_error-report_review=Die unten aufgef\u00fchrten Daten werden zur Fehlersuche an Better BibTeX \u00fcbermittelt. Sie k\u00f6nnen hier eine Vorschau der Daten speichern oder eine Kopie des Log speichern, um die genauen Daten zu erhalten, die gesendet werden sollen, zu sehen, ob es sensible Informationen gibt, die Sie nicht senden m\u00f6chten. Bitte denken Sie sorgf\u00e4ltig dar\u00fcber nach, ob das Abw\u00e4hlen von Optionen f\u00fcr Ihre Umgebung notwendig ist. Wir werden in der Regel mehr Kommunikation (\= Zeit) ben\u00f6tigen, wenn Sie Teile des Logins auf diese Weise entfernen.\n\nWenn Sie diese Daten senden m\u00f6chten, gehen Sie bitte zum n\u00e4chsten Bildschirm, auf dem Sie eine rote Debug-ID angezeigt werden, und posten Sie diese ID auf dem Issue-Tracker auf\n\nhttps\://github. om/retorquere/zotero-better-bibtex/issue
