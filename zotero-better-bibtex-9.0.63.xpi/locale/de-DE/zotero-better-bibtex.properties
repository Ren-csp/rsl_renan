better-bibtex_preferences_advanced_export_retain-cache_warning=Standardm\u00e4\u00dfig l\u00f6scht BBT alle Caches bei einem Upgrade von BBT oder Zotero. Ich kann nicht realistisch vorhersagen, ob eine \u00c4nderung in Zotero oder BBT die erzeugte Ausgabe f\u00fcr einen bestimmten Eintrag beeinflussen wird. Um sicher zu gehen, dass Sie immer die aktuellsten Behebungen haben, die sich auf den Export auswirken, werden die Caches verworfen, wenn eine neue Version von beiden erkannt wird. Wenn Sie jedoch eine sehr gro\u00dfe Bibliothek haben, von der Sie regelm\u00e4\u00dfig erhebliche Teile exportieren, k\u00f6nnen Sie die zwischengespeicherten Eintr\u00e4ge behalten wollen, auch wenn dies mit dem Risiko verbunden ist, dass Sie eine falsche Ausgabe beim Export erhalten, die in der Zwischenzeit repariert wurde.\n\nWenn Sie dies eingeschaltet haben und Sie Probleme haben au\u00dfer der L\u00f6schung des Caches beim Upgrade, *m\u00fcssen* Sie den Cache l\u00f6schen und das Problem reproduzieren. Wenn Sie diese Einstellung \u00e4ndern, wie bei jeder \u00c4nderung der Einstellungen, wird der Cache gel\u00f6scht.
